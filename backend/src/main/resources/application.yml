server:
  port: 8080
  servlet:
    session:
      cookie: { http-only: true, same-site: lax, secure: "${SESSION_COOKIE_SECURE:false}" }
      timeout: 30m
spring:
  application.name: shelfwise
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3307/shelfwise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${DB_USER:shelfwise}
    password: "${DB_PASSWORD:}"
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    baseline-on-migrate: false
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6380}
    timeout: 200ms
    connect-timeout: 200ms
    repositories.enabled: false
  jackson.default-property-inclusion: non_null
management.endpoints.web.exposure.include: health,info
shelfwise:
  demo-enabled: ${DEMO_ENABLED:false}
  demo-password: ${DEMO_PASSWORD:}
  cache-ttl-seconds: 30
