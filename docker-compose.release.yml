name: shelfwise
services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: shelfwise
      MYSQL_USER: shelfwise
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the release env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the release env file}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${SHELFWISE_IMAGE_PREFIX:?Set SHELFWISE_IMAGE_PREFIX in the release env file}/backend:${SHELFWISE_IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/shelfwise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: shelfwise
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the release env file}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    expose: ["8080"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${SHELFWISE_IMAGE_PREFIX:?Set SHELFWISE_IMAGE_PREFIX in the release env file}/frontend:${SHELFWISE_IMAGE_TAG:-latest}
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  mysql-data:
