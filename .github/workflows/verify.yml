name: Verify application and thesis
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: MySQL and Redis integration checks
        working-directory: backend
        run: mvn -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run check && npm test && npm run build && npm audit
        working-directory: frontend
      - name: Public source hygiene
        run: ./scripts/check-clean.sh
  thesis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install thesis compiler
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - run: ./thesis/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: dist/shelfwise-thesis.pdf
